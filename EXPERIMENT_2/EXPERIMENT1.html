<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <link rel="stylesheet" href="experiment1.css">
</head>
<body>
    <header>
        <h1>JobHunt</h1>
        <nav>
            <a>Home</a>
            <a>Jobs</a>
            <a>Companies</a>
            <a>Login</a>
        </nav>
    </header>

    <div class="matter">
        <h2>Find Work That Matters</h2>
        <p>Opportunities rooted in purpose, growth, and stability</p>

        <div class="search-box">
            <input type="text" placeholder="Job title or keyword">
            <input type="text" placeholder="Location">
            <button>Search Jobs</button>
        </div>
        
    </div>

    <div class="section">
        <h3>Latest Openings</h3>
        <div class="jobs">

            <div class="job-card">
                <h4>Frontend Developer</h4>
                <p>Company ABC · Remote</p>
                <button>Apply Now</button>
            </div>

            <div class="job-card">
                <h4>Backend Engineer</h4>
                <p>Company XYZ · Bangalore</p>
                <button>Apply Now</button>
            </div>

            <div class="job-card">
                <h4>Data Analyst</h4>
                <p>Startup Hub · Delhi</p>
                <button>Apply Now</button>
            </div>

        </div>
    </div>

    <footer>© 2026 JobHunt. Built for focus and growth.</footer>
</body>
</html>
